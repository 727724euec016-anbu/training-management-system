<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        body{

            margin:0;
            padding:0;
            font-family:Arial;
            background:#f4f4f4;
        }

        .login-box{

            width:350px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        input{

            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{

            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Login</h1>

        <input type="text"
        id="username"
        placeholder="Username">

        <input type="password"
        id="password"
        placeholder="Password">

        <button onclick="login()">
            Login
        </button>

    </div>

    <script>

        function login(){

            const username =
            document.getElementById('username').value;

            const password =
            document.getElementById('password').value;

            if(username === 'admin'
            && password === 'admin123'){

                window.location.href =
                'dashboard.html';

            }

            else{

                alert('Invalid Credentials');
            }
        }

    </script>

</body>

</html>
